<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synchronizace katalogu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b5fff'/%3E%3Cpath d='M4 6.5h7l-2-2M12 9.5H5l2 2' stroke='white' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
    --ink: #1b1f23;
    --ink-soft: #454b52;
    --muted: #6a737d;
    --line: #e1e4e8;
    --line-strong: #cfd4da;
    --paper: #ffffff;
    --ground: #f6f7f9;
    --fill: #e4e7eb;
    --accent: #0b5fff;
    --accent-soft: #e7efff;
    --accent-line: #b9d0ff;
    --mark: #fff3bf;
    --ok: #1a7f37;
    --ok-soft: #1f883d;
    --warn: #9a6700;
    --bad: #b42318;

    --page: 1180px;
    --gap: 22px;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header { background: var(--paper); border-bottom: 1px solid var(--line); padding: 20px 24px; }
.wrap { max-width: var(--page); margin: 0 auto; }
h1 { margin: 0 0 2px; font-size: 19px; letter-spacing: -0.01em; }
.tag {
    margin-left: 7px; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 999px;
    vertical-align: 2px; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted);
}
.lede { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

.flow { display: flex; align-items: stretch; flex-wrap: wrap; margin: 10px 0 2px; }
.step {
    flex: 1 1 0; min-width: 158px; position: relative;
    padding: 9px 14px 9px 22px; border: 1px solid var(--line); border-right: 0; background: var(--ground);
    transition: background 180ms, border-color 180ms;
}
.step:first-child { border-radius: 8px 0 0 8px; padding-left: 14px; }
/* the batch step has the longest text, so it gets more of the width */
.step:nth-child(3) { flex-grow: 1.5; }
.step:last-child { border-right: 1px solid var(--line); border-radius: 0 8px 8px 0; }
.step::before {
    content: ''; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
    background: var(--ground); border: 1px solid var(--line); border-width: 1px 1px 0 0;
    transform: rotate(45deg); z-index: 2; transition: background 180ms, border-color 180ms;
}
.step:first-child::before { display: none; }
.step .what { font-size: 12.5px; font-weight: 600; }
.step .detail { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step .count { font-variant-numeric: tabular-nums; }
.step.live, .step.live::before { background: var(--accent-soft); border-color: var(--accent-line); }
.step.live .what { color: var(--accent); }
.step.here, .step.here::before { background: var(--paper); }
.step.drifted .detail { color: var(--bad); }

.statusline {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
    min-height: 34px;
    font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
}
.agreement { display: inline-flex; align-items: center; gap: 6px; }
.agreement .icon { width: 15px; height: 15px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.agreement .icon path { display: none; stroke: currentColor; }
.agreement.ok { color: var(--ok-soft); }
.agreement.ok .check { display: inline; }
.agreement.catchingup { color: var(--accent); }
.agreement.catchingup .clock { display: inline; }
.agreement.drifted { color: var(--bad); }
.agreement.drifted .cross { display: inline; }
button.drain {
    padding: 8px 15px; border: 1px solid var(--accent); border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
}
button.drain:hover { background: #0a54e0; }
button.drain[disabled] { opacity: 0.55; cursor: default; }
button.drain.secondary { background: var(--paper); border-color: var(--line-strong); color: var(--ink-soft); }
button.drain.secondary:hover { background: var(--fill); }

.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
input[type=search], input[type=number], select {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); color: inherit;
}
.searchbox { flex: 1 1 340px; }
.searchbox input[type=search] { width: 100%; border: 2px solid var(--line-strong); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.field input[type=number] { width: 92px; padding: 8px 10px; color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.chips:empty { margin: 0; }
.chip {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px 9px; border: 1px solid var(--accent-line); border-radius: 999px;
    background: var(--accent-soft); font-size: 12.5px;
}
.chip button { border: 0; background: none; color: var(--accent); font: inherit; line-height: 1; padding: 0; cursor: pointer; }
.chip button:hover { color: var(--bad); }
.metabar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 10px; }
.meta {
    display: inline-flex; align-items: baseline; gap: 7px; margin: 0; padding: 5px 11px;
    border-radius: 6px; background: var(--fill); color: var(--ink-soft);
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.meta.busy { opacity: 0.55; }

main { max-width: var(--page); margin: 0 auto; padding: 20px 24px 48px; display: grid; grid-template-columns: 236px 1fr; gap: var(--gap); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.results { min-width: 0; max-width: 760px; }
.facets { display: flex; flex-direction: column; gap: 20px; }
.facet h2 { margin: 0 0 7px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.facet button {
    display: flex; justify-content: space-between; gap: 8px; width: 100%;
    padding: 5px 8px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 5px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.facet button:hover { background: var(--fill); }
.facet button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent-line); font-weight: 600; }
.facet .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.facet button[aria-pressed=true] .count { color: var(--accent); }
.facet .crumbs {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px;
    margin-bottom: 6px; padding: 0 8px; font-size: 12.5px;
}
.facet .crumbs button {
    display: inline; width: auto; padding: 0; margin: 0; border: 0; border-radius: 0;
    color: var(--accent);
}
.facet .crumbs button:hover { background: none; text-decoration: underline; }
.facet .crumbs .sep { color: var(--muted); }
.facet .crumbs .here { color: var(--ink); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sku { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted); }
.name { font-size: 16px; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.04em; }
.in-stock { color: var(--ok); }
.out-of-stock { color: var(--bad); }
.row2 { margin-top: 5px; color: var(--muted); font-size: 13.5px; display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.row3 { margin-top: 7px; font-size: 13.5px; color: #3a4148; }
mark { background: var(--mark); padding: 0 1px; border-radius: 2px; }
.paging { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.paging button {
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); font: inherit; cursor: pointer; font-variant-numeric: tabular-nums;
}
.paging button[aria-current=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.paging button[disabled] { opacity: 0.5; cursor: default; }
.paging .gap { align-self: center; padding: 0 2px; color: var(--muted); }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>

<header>
    <div class="wrap">
        <h1>Synchronizace katalogu <span class="tag">ukázka</span></h1>
        <p class="lede">
            Katalog e-shopu průběžně synchronizovaný do Elasticsearch.
        </p>

        <div class="statusline">
            <button class="drain" id="feedButton" type="button">Simulovat dodavatelský soubor (20 000 řádků)</button>
            <span class="agreement ok" id="agreement">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path class="check" d="M2.5 8.5 6.5 12.5 13.5 3.5"/>
                    <path class="cross" d="M4 4 12 12 M12 4 4 12"/>
                    <path class="clock" d="M14 8a6 6 0 1 1-12 0 6 6 0 0 1 12 0M8 4.5V8l2.5 1.5"/>
                </svg>
                <span id="agreementText">index souhlasí s databází</span>
            </span>
            <span id="feedNote"></span>
        </div>

        <div class="flow">
            <div class="step">
                <div class="what">Změna v databázi</div>
                <div class="detail">ceny a sklad z dodavatelského souboru</div>
            </div>
            <div class="step" id="stepQueue">
                <div class="what">Ve frontě <span class="count" id="pendingCount">–</span></div>
                <div class="detail">produktů čeká na zápis</div>
            </div>
            <div class="step here" id="stepBatch">
                <div class="what">Zápis do indexu</div>
                <div class="detail" id="lastDrainSub">zatím neproběhl</div>
            </div>
        </div>


        <div class="controls">
            <div class="searchbox">
                <input type="search" id="text" placeholder="název produktu, SKU nebo EAN" autocomplete="off">
            </div>
            <div class="field">
                <span>cena od</span>
                <input type="number" id="priceFrom" min="0" step="1" aria-label="cena od">
                <span>do</span>
                <input type="number" id="priceTo" min="0" step="1" aria-label="cena do">
            </div>
            <div class="field">
                <span>řadit podle</span>
                <select id="sort" aria-label="řadit podle">
                    <option value="relevance">relevance</option>
                    <option value="price_asc">nejlevnější</option>
                    <option value="price_desc">nejdražší</option>
                </select>
            </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="metabar">
            <p class="meta" id="meta">Načítám…</p>
        </div>
    </div>
</header>

<main>
    <div class="facets" id="facets"></div>
    <div class="results">
        <div id="results"></div>
        <div class="paging" id="paging"></div>
    </div>
</main>

<script>
const DIMENSIONS = {
    category: 'Kategorie',
    brand: 'Značka',
    availability: 'Dostupnost',
};
const AVAILABILITY_LABELS = {
    in_stock: 'skladem',
    out_of_stock: 'vyprodáno',
};
// the poll also runs the drain, a batch whenever the queue is not empty, as a worker would
const STATUS_POLL_MS = 2000;
// a written document becomes searchable on the index refresh cycle, which the reindexer sets to 1s
const INDEX_REFRESH_MS = 1200;
const PAGE_WINDOW = 11;

const numberFormat = new Intl.NumberFormat('cs-CZ');
const priceFormat = new Intl.NumberFormat('cs-CZ', { style: 'currency', currency: 'CZK' });
const timeFormat = new Intl.DateTimeFormat('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dateTimeFormat = new Intl.DateTimeFormat('cs-CZ', { dateStyle: 'short', timeStyle: 'short' });
const czechPlural = new Intl.PluralRules('cs-CZ');
const PRODUCT_FORMS = { one: 'produkt', few: 'produkty', many: 'produktu', other: 'produktů' };
const MISMATCH_FORMS = { one: 'neshoda', few: 'neshody', many: 'neshody', other: 'neshod' };
const ROW_FORMS = { one: 'řádek', few: 'řádky', many: 'řádku', other: 'řádků' };

const selectedBrands = new Set();
let selectedCategory = null;
let selectedAvailability = null;
let currentPage = 1;
let latestSearchTicket = 0;

const elements = {
    text: document.getElementById('text'),
    priceFrom: document.getElementById('priceFrom'),
    priceTo: document.getElementById('priceTo'),
    sort: document.getElementById('sort'),
    chips: document.getElementById('chips'),
    meta: document.getElementById('meta'),
    facets: document.getElementById('facets'),
    results: document.getElementById('results'),
    paging: document.getElementById('paging'),
    feedButton: document.getElementById('feedButton'),
};

function countProducts(count) {
    return numberFormat.format(count) + ' ' + PRODUCT_FORMS[czechPlural.select(count)];
}

function countMismatches(count) {
    return numberFormat.format(count) + ' ' + MISMATCH_FORMS[czechPlural.select(count)];
}

function countRows(count) {
    return numberFormat.format(count) + ' ' + ROW_FORMS[czechPlural.select(count)];
}

/**
 * Checked here, since the server's violation would clear the list on every half typed range.
 */
function isPriceRangeReversed() {
    if (elements.priceFrom.value === '' || elements.priceTo.value === '') {
        return false;
    }

    return Number(elements.priceFrom.value) > Number(elements.priceTo.value);
}

function buildSearchParams() {
    const params = new URLSearchParams();
    if (elements.text.value.trim() !== '') { params.set('text', elements.text.value.trim()); }
    if (elements.priceFrom.value !== '') { params.set('priceFromCrowns', elements.priceFrom.value); }
    if (elements.priceTo.value !== '') { params.set('priceToCrowns', elements.priceTo.value); }
    if (selectedCategory !== null) { params.set('category', selectedCategory); }
    if (selectedAvailability !== null) { params.set('availability', selectedAvailability); }
    selectedBrands.forEach((brand) => params.append('brand[]', brand));
    params.set('sort', elements.sort.value);
    params.set('page', String(currentPage));
    return params;
}

async function search() {
    if (isPriceRangeReversed()) {
        elements.meta.classList.remove('busy');
        elements.meta.textContent = 'Cena od je vyšší než cena do.';

        return;
    }

    const ticket = ++latestSearchTicket;
    elements.meta.classList.add('busy');

    let response;
    let result;
    try {
        response = await fetch('/api/products?' + buildSearchParams().toString());
        result = await response.json();
    } catch {
        response = null;
        result = {};
    }

    // a slower earlier request must not overwrite a newer answer
    if (ticket !== latestSearchTicket) { return; }
    elements.meta.classList.remove('busy');

    if (response === null || !response.ok) {
        elements.meta.textContent = result.detail ?? 'Hledání selhalo';
        elements.results.innerHTML = '';
        elements.paging.innerHTML = '';
        return;
    }

    elements.meta.textContent = countProducts(result.total) + ' · ' + result.elapsedMilliseconds + ' ms';
    renderChips();
    renderFacets(result.facets);
    renderHits(result.hits);
    renderPaging(result.total);
}

function renderChips() {
    const chips = [];
    selectedBrands.forEach((brand) => chips.push(buildChip(brand, () => { selectedBrands.delete(brand); })));
    if (selectedCategory !== null) {
        chips.push(buildChip(selectedCategory, () => { selectedCategory = null; }));
    }
    if (selectedAvailability !== null) {
        chips.push(buildChip(AVAILABILITY_LABELS[selectedAvailability], () => { selectedAvailability = null; }));
    }

    elements.chips.replaceChildren(...chips);
}

function buildChip(label, clear) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.append(label);

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '×';
    button.setAttribute('aria-label', 'zrušit ' + label);
    button.addEventListener('click', () => { clear(); currentPage = 1; search(); });
    chip.append(button);

    return chip;
}

function renderFacets(facets) {
    const blocks = [];

    Object.keys(DIMENSIONS).forEach((dimension) => {
        // availability is a filters aggregation, so it returns zero counts too
        const buckets = (facets[dimension]?.buckets ?? []).filter((bucket) => bucket.count > 0);
        const hasBreadcrumb = dimension === 'category' && selectedCategory !== null;

        if (buckets.length === 0 && !hasBreadcrumb) {
            return;
        }

        const block = document.createElement('div');
        block.className = 'facet';

        const heading = document.createElement('h2');
        heading.textContent = DIMENSIONS[dimension];
        block.append(heading);

        if (hasBreadcrumb) {
            block.append(buildCategoryBreadcrumb());
        }

        buckets.forEach((bucket) => {
            block.append(buildFacetButton(dimension, bucket));
        });

        blocks.push(block);
    });

    elements.facets.replaceChildren(...blocks);
}

function buildCategoryBreadcrumb() {
    const trail = document.createElement('div');
    trail.className = 'crumbs';
    trail.append(buildCrumb('vše', null));

    const segments = selectedCategory.split('/');
    segments.forEach((segment, depth) => {
        const separator = document.createElement('span');
        separator.className = 'sep';
        separator.textContent = '›';

        trail.append(separator, buildCrumb(segment, segments.slice(0, depth + 1).join('/')));
    });

    return trail;
}

function buildCrumb(label, path) {
    if (path === selectedCategory) {
        const here = document.createElement('span');
        here.className = 'here';
        here.textContent = label;

        return here;
    }

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => { selectedCategory = path; currentPage = 1; search(); });

    return button;
}

function buildFacetButton(dimension, bucket) {
    const button = document.createElement('button');
    button.type = 'button';

    const label = document.createElement('span');
    label.textContent = dimension === 'category'
        ? bucket.value.slice(bucket.value.lastIndexOf('/') + 1)
        : (AVAILABILITY_LABELS[bucket.value] ?? bucket.value);

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = numberFormat.format(bucket.count);

    button.append(label, count);
    button.setAttribute('aria-pressed', String(isSelected(dimension, bucket.value)));
    button.addEventListener('click', () => { toggleFacet(dimension, bucket.value); currentPage = 1; search(); });

    return button;
}

function isSelected(dimension, value) {
    if (dimension === 'brand') { return selectedBrands.has(value); }
    if (dimension === 'category') { return selectedCategory === value; }
    return selectedAvailability === value;
}

function toggleFacet(dimension, value) {
    if (dimension === 'brand') {
        selectedBrands.has(value) ? selectedBrands.delete(value) : selectedBrands.add(value);
        return;
    }
    if (dimension === 'category') {
        selectedCategory = selectedCategory === value ? null : value;
        return;
    }
    selectedAvailability = selectedAvailability === value ? null : value;
}

function renderHits(hits) {
    if (hits.length === 0) {
        elements.results.innerHTML = '<p class="empty">Nic neodpovídá.</p>';
        return;
    }

    elements.results.replaceChildren(...hits.map(buildCard));
}

function buildCard(hit) {
    const card = document.createElement('div');
    card.className = 'card';

    const row1 = document.createElement('div');
    row1.className = 'row1';

    const sku = document.createElement('span');
    sku.className = 'sku';
    // the server marks what matched, and nothing else in the response is rendered as markup
    sku.innerHTML = hit.highlight?.sku?.[0] ?? escapeHtml(hit.sku);

    const name = document.createElement('span');
    name.className = 'name';
    name.innerHTML = hit.highlight?.name?.[0] ?? escapeHtml(hit.name);

    const badge = document.createElement('span');
    badge.className = 'badge ' + (hit.stockQuantity > 0 ? 'in-stock' : 'out-of-stock');
    badge.textContent = hit.stockQuantity > 0 ? 'skladem' : 'vyprodáno';

    row1.append(sku, name, badge);

    const row2 = document.createElement('div');
    row2.className = 'row2';
    row2.append(
        buildSpan(hit.brand),
        buildSpan(hit.categoryPath),
        buildSpan(priceFormat.format(hit.price)),
        buildSpan(numberFormat.format(hit.stockQuantity) + ' ks'),
        buildMarkedSpan('EAN ', hit.highlight?.ean?.[0] ?? escapeHtml(hit.ean)),
        buildSpan('změněno ' + dateTimeFormat.format(new Date(hit.updatedAt))),
    );

    card.append(row1, row2);

    if (hit.highlight?.description?.[0]) {
        const row3 = document.createElement('div');
        row3.className = 'row3';
        row3.innerHTML = hit.highlight.description[0];
        card.append(row3);
    }

    return card;
}

function buildSpan(text) {
    const span = document.createElement('span');
    span.textContent = text;
    return span;
}

function buildMarkedSpan(label, markup) {
    const span = document.createElement('span');
    span.innerHTML = escapeHtml(label) + markup;
    return span;
}

function renderPaging(total) {
    const pageCount = Math.min(Math.ceil(total / 24), Math.floor(10000 / 24));
    if (pageCount <= 1) {
        elements.paging.replaceChildren();
        return;
    }

    const buttons = [buildPageButton('‹', currentPage - 1, currentPage === 1, false)];

    for (const page of buildPageNumbers(pageCount)) {
        buttons.push(page === null
            ? buildPageGap()
            : buildPageButton(numberFormat.format(page), page, false, page === currentPage));
    }

    buttons.push(buildPageButton('›', currentPage + 1, currentPage === pageCount, false));
    elements.paging.replaceChildren(...buttons);
}

/**
 * The first and last page are always shown; null is the gap between them and the window around the current page.
 */
function buildPageNumbers(pageCount) {
    const pages = [];
    if (pageCount <= PAGE_WINDOW) {
        for (let page = 1; page <= pageCount; ++page) { pages.push(page); }

        return pages;
    }

    const windowSize = PAGE_WINDOW - 4;
    const firstShown = Math.max(2, Math.min(currentPage - Math.floor(windowSize / 2), pageCount - windowSize));
    const lastShown = Math.min(pageCount - 1, firstShown + windowSize - 1);

    pages.push(1);
    if (firstShown > 2) { pages.push(null); }
    for (let page = firstShown; page <= lastShown; ++page) { pages.push(page); }
    if (lastShown < pageCount - 1) { pages.push(null); }
    pages.push(pageCount);

    return pages;
}

function buildPageGap() {
    const gap = document.createElement('span');
    gap.className = 'gap';
    gap.textContent = '…';

    return gap;
}

function buildPageButton(label, page, disabled, current) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.disabled = disabled;
    if (current) { button.setAttribute('aria-current', 'true'); }
    button.addEventListener('click', () => { currentPage = page; search(); window.scrollTo({ top: 0 }); });

    return button;
}

function describeAgreement(status, isCatchingUp) {
    if (isCatchingUp) {
        return 'Index se aktualizuje…';
    }

    if (status.driftedProductCount === 0) {
        return 'Databáze souhlasí s indexem';
    }

    return countMismatches(status.driftedProductCount) + ' mezi databází a indexem';
}

async function loadStatus() {
    const response = await fetch('/api/sync/status');
    if (!response.ok) { return; }

    const status = await response.json();
    document.getElementById('pendingCount').textContent = numberFormat.format(status.pendingProductCount);
    document.getElementById('stepQueue').classList.toggle('live', status.pendingProductCount > 0);

    document.getElementById('lastDrainSub').textContent = status.lastDrainAt === null
        ? 'zatím neproběhl'
        : timeFormat.format(new Date(status.lastDrainAt))
            + ' · zapsáno ' + numberFormat.format(status.lastDrainWrittenProductCount)
            + ' · beze změny ' + numberFormat.format(status.lastDrainUnchangedProductCount)
            + ' · ' + numberFormat.format(status.lastDrainElapsedMilliseconds) + ' ms';
    if (hasLastDrainFailed) {
        document.getElementById('lastDrainSub').textContent += ' · poslední zápis selhal';
    }

    // with a pending queue the index is behind as expected, so drift is not reported yet
    const isCatchingUp = status.pendingProductCount > 0;
    const agreement = document.getElementById('agreement');
    agreement.classList.toggle('catchingup', isCatchingUp);
    agreement.classList.toggle('ok', !isCatchingUp && status.driftedProductCount === 0);
    agreement.classList.toggle('drifted', !isCatchingUp && status.driftedProductCount > 0);

    document.getElementById('agreementText').textContent = describeAgreement(status, isCatchingUp);

    if (status.pendingProductCount > 0 && !isDraining) {
        drain();
    }

    if (status.pendingProductCount === 0 && !isDraining && runningFeed !== null) {
        reportFinishedRun();
    }
}

/**
 * The endpoint only fills the queue; reportFinishedRun() reports the run once the drains have emptied it.
 */
async function runSupplierFeed() {
    const note = document.getElementById('feedNote');
    elements.feedButton.disabled = true;
    note.textContent = 'soubor se zpracovává…';
    runningFeed = null;

    try {
        const response = await fetch('/api/dev/supplier-feed', { method: 'POST' });
        const feedResult = await response.json();

        if (!response.ok) {
            note.textContent = 'soubor se nepodařilo zpracovat';

            return;
        }

        runningFeed = { feedResult, written: 0, unchanged: 0 };
    } catch {
        note.textContent = 'soubor se nepodařilo zpracovat';
    } finally {
        elements.feedButton.disabled = false;
        loadStatus();
    }
}

/**
 * The counts after the arrow do not add up to it: a product drained while the file was still being
 * written is queued and counted twice.
 */
function reportFinishedRun() {
    const finished = runningFeed;
    runningFeed = null;

    document.getElementById('feedNote').textContent = 'Hotovo: '
        + countRows(finished.feedResult.touchedRowCount) + ' → '
        + countProducts(finished.feedResult.pendingProductCount) + ' ve frontě'
        + ' · zapsáno ' + numberFormat.format(finished.written)
        + ' · beze změny ' + numberFormat.format(finished.unchanged)
        + ' · staženo z prodeje ' + numberFormat.format(finished.feedResult.discontinuedProductCount);
}

let isDraining = false;
let hasLastDrainFailed = false;
let refreshTimer = null;
let runningFeed = null;

/**
 * A batch takes longer than the poll, so without isDraining several requests would drain the same rows.
 */
async function drain() {
    isDraining = true;
    document.getElementById('stepBatch').classList.add('live');

    let hasFailed = false;
    try {
        const response = await fetch('/api/sync/drain', { method: 'POST' });
        const drainResult = await response.json();

        if (response.ok && runningFeed !== null) {
            runningFeed.written += drainResult.writtenProductCount;
            runningFeed.unchanged += drainResult.unchangedProductCount;
        }

        hasFailed = !response.ok;
    } catch {
        hasFailed = true;
    } finally {
        isDraining = false;
        document.getElementById('stepBatch').classList.remove('live');
    }

    hasLastDrainFailed = hasFailed;

    // the status poll retries; draining again at once would loop as fast as the server can fail
    if (hasFailed) {
        document.getElementById('lastDrainSub').textContent = 'zápis selhal';

        return;
    }

    loadStatus();
    // one refresh after the last batch of a backlog, once the index refresh cycle has passed
    window.clearTimeout(refreshTimer);
    refreshTimer = window.setTimeout(search, INDEX_REFRESH_MS);
}

function escapeHtml(value) {
    const holder = document.createElement('span');
    holder.textContent = value;
    return holder.innerHTML;
}

let searchTimer = null;
function searchSoon() {
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => { currentPage = 1; search(); }, 200);
}

elements.text.addEventListener('input', searchSoon);
elements.priceFrom.addEventListener('change', searchSoon);
elements.priceTo.addEventListener('change', searchSoon);
elements.sort.addEventListener('change', () => { currentPage = 1; search(); });
elements.feedButton.addEventListener('click', runSupplierFeed);

search();
loadStatus();
window.setInterval(loadStatus, STATUS_POLL_MS);
</script>
